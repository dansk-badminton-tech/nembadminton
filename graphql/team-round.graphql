extend type Query {
    teamRound(id: ID! @eq) : TeamRound @find
    teamRounds(
        clubhouseId: ID! @eq(key: "clubhouse_id"),
        order: _ @orderBy(columns: ["created_at", "updated_at", "game_date"]),
        gameDate: DateRange @whereBetween(key: "game_date")
    ) : [TeamRound!]! @paginate(defaultCount: 20, scopes: ["visibleToUser"]) @guard @canResolved(ability: "view")
    export(teamRoundId: ID!, includeCategories: Boolean = true) : String! @field(resolver: "FlyCompany\\TeamFight\\GraphQL\\Queries\\Exporter")
    squadMember(id: ID! @eq) : SquadMember @find @guard @canResolved(ability: "view")
    "Team notification activity"
    teamNotificationActivity(id: ID! @eq(key: "team_round_id")) : [TeamActivityLog!]! @all @orderBy(column: "created_at", direction: DESC) @guard @canResolved(ability: "view")
    teamRoundReceiver(
        teamRoundId: ID @eq(key: "team_round_id")
    ) : TeamReceivers @find @guard @canResolved(ability: "view")
    "Tournament groups for a season. Used as UI metadata when adding squads."
    tournamentGroups(
        seasonId: Int! @eq(key: "season_id")
        phaseType: String @eq(key: "phase_type")
        order: _ @orderBy(columns: ["group_name", "phase_type", "tier_id"])
    ): [TournamentGroupOption!]! @all(model: "App\\Models\\TournamentGroup")
    "All known tournament tiers. Used as suggestions when naming a squad."
    tournamentTiers(
        order: _ @orderBy(columns: ["tier_name"])
    ): [TournamentTierOption!]! @all(model: "App\\Models\\TournamentTier")
}

type TournamentGroupOption {
    id: ID!
    seasonId: Int! @rename(attribute: "season_id")
    tierId: Int @rename(attribute: "tier_id")
    groupName: String! @rename(attribute: "group_name")
    phaseType: String! @rename(attribute: "phase_type")
    tournamentTier: TournamentTierOption @belongsTo(relation: "tournamentTier")
}

type TournamentTierOption {
    id: ID!
    tierName: String @rename(attribute: "tier_name")
}

extend type Mutation {
    updateSquadPoint(input: UpdateSquadPointInput! @spread) : SquadPoint @update @guard @canFind(ability: "update", find: "id")
    deleteSquadMember(id: ID! @eq) : SquadMember @delete @guard @canFind(ability: "delete", find: "id")
    updateSquadMember(input: UpdateSquadMemberInput! @spread) : SquadMember @update @guard @canFind(ability: "update", find: "id")
    addSquadMemberByRefId(input: AddSquadMemberByRefIdInput! @spread) : SquadMember @field(resolver: "FlyCompany\\TeamFight\\GraphQL\\Mutations\\AddSquadMemberByRefId") @canFind(ability: "update", find: "categoryId", model: "SquadCategory")
    deleteSquad(id: ID! @eq) : Squad @guard @delete @canFind(ability: "delete", find: "id")
    createSquad(input: CreateSquadInput! @spread) : Squad! @create @guard @canFind(ability: "view", find: "teamRound.connect", model: "TeamRound")
    updateSquad(input: UpdateSquadInput! @spread) : Squad! @update @guard @canFind(ability: "update", find: "id")
    moveSquadOrderUp(id: ID!) : Squad! @field(resolver: "FlyCompany\\TeamFight\\GraphQL\\Mutations\\SquadOrdering@moveSquadOrderUp") @canFind(ability: "update", find: "id")
    moveSquadOrderDown(id: ID!) : Squad! @field(resolver: "FlyCompany\\TeamFight\\GraphQL\\Mutations\\SquadOrdering@moveSquadOrderDown") @canFind(ability: "update", find: "id")
    updateTeamRound(input: UpdateTeamRoundInput! @spread): TeamRound! @guard @update @canFind(ability: "update", find: "id")
    createTeamRound(input: CreateTeamRoundInput! @spread) : TeamRound! @create @guard @canModel(ability: "create") @inject(context: "user.id", name: "user_id") @inject(context: "user.clubhouse_id", name: "clubhouse_id")
    copyTeamRound(id: ID!) : TeamRound! @guard @field(resolver: "FlyCompany\\TeamFight\\GraphQL\\Mutations\\CopyTeam@copyTeam")
    deleteTeamRound(id: ID! @eq) : TeamRound! @guard @delete @canFind(ability: "delete", find: "id")
    "Sending notifications to all players"
    sendTeamNotification(input: SendTeamNotificationInput! @spread) : SendTeamNotificationResult! @guard @canFind(ability: "update", find: "id", model: "TeamRound") @inject(context: "user.id", name: "user_id") @field(resolver: "FlyCompany\\TeamFight\\GraphQL\\Mutations\\SendTeamNotification")
    "Changes all player points to the new version. Does not update if squad has a specific version"
    updatePointsTeamRound(id: ID!, version: String!) : TeamRound @guard @field(resolver: "FlyCompany\\TeamFight\\GraphQL\\Mutations\\UpdateTeamRound@updatePointsOnAllSquadsInTeamRound")
    "Changes all player points to the new version."
    updatePointsSquad(id: ID!, version: String) : Squad @guard @field(resolver: "FlyCompany\\TeamFight\\GraphQL\\Mutations\\UpdateTeamRound@updatePointsOnSquad")
    "Create a new scenario cloning categories and player assignments"
    createScenario(teamRoundId: ID!, name: String!, sourceScenarioId: ID): TeamRoundScenario! @guard @canFind(ability: "update", find: "teamRoundId", model: "TeamRound") @field(resolver: "FlyCompany\\TeamFight\\GraphQL\\Mutations\\CreateScenario")
    "Promote a draft scenario to official lineup, preserving outgoing official lineup as a draft"
    promoteScenario(scenarioId: ID!): TeamRound! @guard @canFind(ability: "update", find: "scenarioId", model: "TeamRoundScenario") @field(resolver: "FlyCompany\\TeamFight\\GraphQL\\Mutations\\PromoteScenario")
    "Rename a scenario"
    renameScenario(scenarioId: ID!, name: String!): TeamRoundScenario! @guard @canFind(ability: "update", find: "scenarioId", model: "TeamRoundScenario") @field(resolver: "FlyCompany\\TeamFight\\GraphQL\\Mutations\\RenameScenario")
    "Record that a reserve plays for a player on this Squad (§43), in a Scenario or, without one, the official lineup, and put the reserve in the replaced player's slots on this Squad. The reserve is an Available Member of the Clubhouse or stands on a lower Squad, where they keep their slot. Rejected when the reserve stands on this or a higher Squad, a reserve who isn't placed isn't a Member of the Clubhouse, the replaced player isn't on this Squad, or either already has a record in the lineup."
    addSquadReserve(squadId: ID!, scenarioId: ID, reserveRefId: String!, replacedRefId: String!): SquadReserve! @guard @canFind(ability: "editReserves", find: "squadId", model: "Squad") @field(resolver: "FlyCompany\\TeamFight\\GraphQL\\Mutations\\AddSquadReserve")
    "Remove a reserve record and put the replaced player back in the reserve's slots on the Squad"
    deleteSquadReserve(id: ID!): SquadReserve @guard @canFind(ability: "delete", find: "id") @field(resolver: "FlyCompany\\TeamFight\\GraphQL\\Mutations\\DeleteSquadReserve")
    "Delete a draft scenario and all associated categories, players, and points"
    deleteScenario(scenarioId: ID!): Boolean! @guard @canFind(ability: "delete", find: "scenarioId", model: "TeamRoundScenario") @field(resolver: "FlyCompany\\TeamFight\\GraphQL\\Mutations\\DeleteScenario")
}

type TeamReceivers {
    id: ID!
    teamRound: TeamRound @belongsTo(relation: "teamRound")
    emails: [String!]!
}

type SendTeamNotificationResult {
    teamRound: TeamRound!
    sentCount: Int!
    skippedPlayers: [String!]!
}

input SendTeamNotificationInput {
    "Team Fight ID"
    id: ID!
    "Type of message"
    type: TeamNotificationType!
    "Message to players"
    message: String
    "Receivers"
    receivers: ReceiverInput!
}

enum TeamNotificationType {
    TEAM_PUBLISH @enum(value: "team_publish")
    TEAM_UPDATED @enum(value: "team_updated")
}

input ReceiverInput {
    method: ReceiverMethod!
    "Only used for ReceiverMethod MANUAL_EMAILS"
    saveEmails: Boolean
    "Only used for ReceiverMethod MANUAL_EMAILS"
    emails: [String!]
    "Only used for ReceiverMethod PLATFORM. Subset of player refIds to send to. Omit/null = all players."
    selectedRefIds: [String!]
}

enum ReceiverMethod {
    MANUAL_EMAILS
    TEST_SELF
    PLATFORM
}

input UpdateSquadMemberInput {
    id: ID!
    points: CreatePointHasManyInput!
}

input AddSquadMemberByRefIdInput {
    refId: String!
    categoryId: Int!
    version: Date!
}

input UpdateSquadPointInput {
    id: ID!
    category: Category
    points: Int
    position: Int
    vintage: Vintage
    corrected_manually: Boolean
}

input DateRange {
    from: Date!
    to: Date!
}

input CreateCategoryBelongsTo {
    connect: ID!
}

input CreatePointHasManyInput {
    create: [CreatePointInput!]!
}

input CreatePointInput {
    category: Category!
    points: Int!
    position: Int
    vintage: Vintage!
    corrected_manually: Boolean!
    version: Date!
}

input UpdateSquadInput {
    id: ID!
    playerLimit: Int
    order: Int
    "BadmintonPlayer match ID"
    externalTeamFightID: Int @rename(attribute: "external_team_fight_id")
    "Playing team"
    playingDatetime: DateTime @rename(attribute: "playing_datetime")
    "Playing place"
    playingPlace: String @rename(attribute: "playing_place")
    "Playing Address"
    playingAddress: String @rename(attribute: "playing_address")
    "Playing Zip code"
    playingZipCode: String @rename(attribute: "playing_zip_code")
    "Playing City"
    playingCity: String @rename(attribute: "playing_city")
    "Name"
    name: String
    "Tier"
    tier: String
    "Optional organizational team this squad is created from (pass null to disconnect)"
    teamId: ID @rename(attribute: "team_id") @rules(apply: ["App\\Rules\\TeamInClubhouse"])
    "Paper Squad (papirhold). Only a squad with a team can be one."
    isPaperSquad: Boolean @rename(attribute: "is_paper_squad")
    "Ranking version"
    version: Date
}

input CreateSquadInput {
    teamRound: SquadBelongsTo!
    playerLimit: Int!
    categories: CreateCategoryHasManyInput!
    order: Int
    "Optional organizational team this squad was created from"
    teamId: ID @rename(attribute: "team_id")
    "Paper Squad (papirhold), default false. Only a squad with a team can be one."
    isPaperSquad: Boolean @rename(attribute: "is_paper_squad")
    "Tier"
    tier: String
    "BadmintonPlayer match ID"
    externalTeamFightID: Int @rename(attribute: "external_team_fight_id")
    "Playing team"
    playingDatetime: DateTime @rename(attribute: "playing_datetime")
    "Playing place"
    playingPlace: String @rename(attribute: "playing_place")
    "Playing Address"
    playingAddress: String @rename(attribute: "playing_address")
    "Playing Zip code"
    playingZipCode: String @rename(attribute: "playing_zip_code")
    "Playing City"
    playingCity: String @rename(attribute: "playing_city")
    "Name"
    name: String
    "Ranking Version"
    version: Date
}

input SquadBelongsTo {
    connect: ID!
}

input CreateCategoryHasManyInput {
    create: [CreateCategoryInput!]!
}

input CreateCategoryInput {
    category: String!
    name: String!
}

input CreateTeamRoundInput {
    name: String
    version: Date
    round: Int
    gameDate: Date @rename(attribute: "game_date")
    seasonId: Int! @rename(attribute: "season_id")
}

input UpdateTeamRoundInput {
    id: ID!
    name: String
    version: Date!
    round: Int
    gameDate: Date! @rename(attribute: "game_date")
    seasonId: Int @rename(attribute: "season_id")
}

enum LeagueType{
    LIGA @enum(value: "LIGA")
    FIRSTDIVISION @enum(value: "FIRSTDIVISION")
    OTHER @enum(value: "OTHER")
}

type SquadMember {
    id: ID!
    refId: String! @rename(attribute: "member_ref_id")
    name: String!
    gender: Gender!
    vintage: Vintage! @method(name: "getVintage")
    isInSquad: Boolean! @field(resolver: "App\\Models\\SquadMember@getIsInSquad")
    points: [SquadPoint!] @hasMany
    parallelAllocation: ParallelTeamRoundAllocation @field(resolver: "FlyCompany\\TeamFight\\GraphQL\\Queries\\ParallelAllocationResolver")
    "The player's afbud for the team round they are placed in, or null when they have none."
    cancellation: PlacedPlayerCancellation @field(resolver: "FlyCompany\\TeamFight\\GraphQL\\Queries\\PlacedPlayerCancellationResolver")
    "Reserve Quarantine (§44): where the player was a Reserve Player in the Official Lineup of the round before, in the same Clubhouse and Season. Null for a User of another Clubhouse."
    reserveQuarantine: ReserveQuarantine @guard @field(resolver: "FlyCompany\\TeamFight\\GraphQL\\Queries\\ReserveQuarantineResolver")
}

"Where a placed player was a Reserve Player in the round before"
type ReserveQuarantine {
    "The TeamRound the player was a reserve in"
    teamRoundId: ID!
    teamRoundName: String!
    round: Int!
    "1-based place of the Squad they were a reserve on (Hold 1, Hold 2, ...)"
    squadPosition: Int!
    "The player they replaced"
    replacedName: String!
}

type SquadPoint {
    id: ID!
    points: Int
    position: Int
    category: String
    vintage: String
    version: Date
    corrected_manually: Boolean
}

type SquadCategory {
    id: ID
    category: String!
    name: String!
    players: [SquadMember!]!
}

"A reserve record (§43): the reserve, an Available Member or a Member from a lower Squad, plays for the replaced player on the Squad"
type SquadReserve {
    id: ID!
    reserve: SquadReservePlayer! @method(name: "reservePlayer")
    replaced: SquadReservePlayer! @method(name: "replacedPlayer")
    "The replaced player's ranking points at the Squad's ranking version: they no longer stand on the Squad, and the reserve is checked against them (§43 stk. 3). Empty for a User of another Clubhouse."
    replacedPoints: [Point!]! @guard @field(resolver: "FlyCompany\\TeamFight\\GraphQL\\Queries\\SquadReplacedPointsResolver")
    "Null for the lineup of a TeamRound without an official Scenario"
    scenarioId: ID @rename(attribute: "team_round_scenario_id")
}

type SquadReservePlayer {
    refId: String!
    name: String!
    gender: Gender!
    vintage: Vintage!
}

type PlacedPlayerCancellation {
    "The player has a permanent afbud (playable = false) and cannot play in any team round."
    permanent: Boolean!
    "The afbud was sent through the afbudslink rather than registered in the team round."
    viaCancellationLink: Boolean!
}

type ParallelTeamRoundAllocation {
    teamRoundId: ID!
    teamRoundName: String!
    squadName: String
    squadOrder: Int
    categoryName: String
}

type Squad {
    "ID"
    id: ID!
    "Number of players on the team"
    playerLimit: Int!
    "Name"
    name: String
    "Free-text tier label (autocompleted from tournament_tiers, but stored as plain string). Only used when no team is attached."
    tier: String
    "The tier to display: the attached team's current tier, or `tier` when no team is attached"
    effectiveTier: String @with(relation: "team.tier") @method(name: "effectiveTier")
    "Organizational team this squad was created from (optional)"
    team: Team @belongsTo
    "Paper Squad (papirhold): lined up as a regular squad, but the match is not played"
    isPaperSquad: Boolean! @rename(attribute: "is_paper_squad")
    "BadmintonPlayer match ID"
    externalTeamFightID: Int @rename(attribute: "external_team_fight_id")
    "Playing team"
    playingDatetime: DateTime @rename(attribute: "playing_datetime")
    "Playing place"
    playingPlace: String @rename(attribute: "playing_place")
    "Playing Address"
    playingAddress: String @rename(attribute: "playing_address")
    "Playing Zip code"
    playingZipCode: String @rename(attribute: "playing_zip_code")
    "Playing City"
    playingCity: String @rename(attribute: "playing_city")
    "Categories"
    categories(scenarioId: ID): [SquadCategory!]! @field(resolver: "FlyCompany\\TeamFight\\GraphQL\\Queries\\SquadCategoriesResolver")
    "Reserve records (§43) on this Squad, in the Scenario or, without one, the official lineup"
    reserves(scenarioId: ID): [SquadReserve!]! @field(resolver: "FlyCompany\\TeamFight\\GraphQL\\Queries\\SquadReservesResolver")
    "Order"
    order: Int!
    "Ranking version"
    version: Date
}

type TeamRound {
    id: ID!,
    "Squads"
    squads: [Squad!]! @hasMany,
    "Name of the team"
    name: String,
    "Version"
    version: Date
    "Runde"
    round: Int
    "Game day"
    gameDate: Date @rename(attribute: "game_date"),
    "Season"
    season: Season @belongsTo
    "Calendar year the season starts in (from the season, or else the game date)"
    seasonStartYear: Int @method
    "Updated at"
    updatedAt: DateTime @rename(attribute: "updated_at")
    "Created at"
    createdAt: DateTime @rename(attribute: "created_at")
    "Activity logs"
    activityLogs: [TeamActivityLog!]! @hasMany
    "Team receivers"
    receiver: TeamReceivers @hasOne
    "Clubhouse"
    clubhouse: Clubhouse @belongsTo
    "Ref IDs of players on this team round that have a linked platform user account (single batched query)"
    reachablePlayerRefIds: [String!]! @field(resolver: "App\\Models\\TeamRound@getReachablePlayerRefIds")
    "Scenarios"
    scenarios: [TeamRoundScenario!]! @hasMany(relation: "scenarios")
    "Official scenario"
    officialScenario: TeamRoundScenario @hasOne(relation: "officialScenario")
    "Season History: the Category Rank ladder of every earlier TeamRound of the Clubhouse in the Season, by round number (not game date), then this TeamRound's own. Earlier means a lower round number; without a round number, this TeamRound has no earlier TeamRounds. Official Lineups only."
    seasonHistory: [SeasonHistoryRound!]! @guard @canRoot(ability: "viewSeasonHistory") @field(resolver: "App\\GraphQL\\Queries\\TeamRoundSeasonHistory")
}

"A TeamRound in the Season History"
type SeasonHistoryRound {
    "TeamRound ID"
    id: ID!
    "Display name of the TeamRound"
    name: String!
    gameDate: Date
    "Round number (runde)"
    round: Int
    "Null when the TeamRound has no round number"
    phase: SeasonPhase
    "True for the viewed TeamRound, which comes last. Only the viewed TeamRound can be without a round number."
    isCurrent: Boolean!
    "One ladder per category: HS, DS, HD, DD, MD"
    categories: [SeasonHistoryCategory!]!
}

type SeasonHistoryCategory {
    "HS, DS, HD, DD or MD"
    category: String!
    "The category's places across the Clubhouse's Squads, in team order"
    places: [SeasonHistoryPlace!]!
}

"A place in a category's ladder. In doubles both partners share it."
type SeasonHistoryPlace {
    "Category Rank (Kategoriplads), 1-based"
    place: Int!
    "1-based place of the Squad in the TeamRound's Squad order (Hold 1, Hold 2, ...)"
    squadPosition: Int!
    "The Team's name, or the Squad's own name when it has no Team"
    teamName: String
    "The Squad's tier (række)"
    tier: String
    "True when the Squad is a Paper Squad (papirhold). Its places count as played like any other."
    isPaperSquad: Boolean!
    "Category name, e.g. \"2. HS\""
    label: String!
    players: [SeasonHistoryPlayer!]!
}

type SeasonHistoryPlayer {
    refId: String!
    name: String!
    gender: Gender!
    vintage: Vintage!
}

enum SeasonPhase {
    GRUNDSPIL @enum(value: "grundspil")
    SLUTSPIL @enum(value: "slutspil")
    KVALIFIKATION @enum(value: "kvalifikation")
}

type TeamRoundScenario {
    id: ID!
    teamRoundId: ID! @rename(attribute: "team_round_id")
    name: String!
    isOfficial: Boolean! @rename(attribute: "is_official")
    createdAt: DateTime @rename(attribute: "created_at")
    updatedAt: DateTime @rename(attribute: "updated_at")
}

type TeamActivityLog {
    "ID"
    id: ID!
    "Team Round ID"
    teamRoundId: ID! @rename(attribute: "team_round_id")
    "Action"
    action: ActivityAction!
    "Recipient type"
    recipientType: ReceiverMethod @rename(attribute: "recipient_type")
    "Recipient count"
    recipientCount: Int @rename(attribute: "recipient_count")
    "Recipients summary"
    recipientsSummary: String @rename(attribute: "recipients_summary")
    "Message"
    message: String
    "Metadata"
    metadata: String! @rename(attribute: "raw_metadata")
    "User ID"
    userId: ID @rename(attribute: "user_id")
    "Created at"
    createdAt: DateTime @rename(attribute: "created_at")
    "Updated at"
    updatedAt: DateTime @rename(attribute: "updated_at")
    "Team"
    teamRound: TeamRound! @belongsTo(relation: "teamRound")
    "User"
    user: User @belongsTo
}

enum ActivityAction {
    TEAM_PUBLISH @enum(value: "team_publish")
    TEST_EMAIL_SENT @enum(value: "test_email_sent")
    TEAM_UPDATED @enum(value: "team_updated")
}
