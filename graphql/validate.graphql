extend type Mutation {
    "§27 stk. 5 for qualification in 2. division–Danmarksserien, using round numbers only, not the calendar-year alternative. Advisory."
    validateQualificationEligibility(teamRoundId: ID!, scenarioId: ID): [QualificationEligibilityPlayer!]! @guard @canFind(ability: "viewSeasonHistory", find: "teamRoundId", model: "TeamRound") @field(resolver: "App\\GraphQL\\Mutations\\ValidateQualificationEligibility")
    "§38 stk. 8, checked against earlier Official Lineups. Advisory; never blocks saving."
    validateFinalRoundEligibility(teamRoundId: ID!, scenarioId: ID): [FinalRoundEligibilityPlayer!]! @guard @canFind(ability: "viewSeasonHistory", find: "teamRoundId", model: "TeamRound") @field(resolver: "App\\GraphQL\\Mutations\\ValidateFinalRoundEligibility")
    "Validates players is playing on the right squad (category-ranking)"
    validateCrossSquads(input: [ValidateTeam!]!) : [PlayingToHigh!]! @field(resolver: "FlyCompany\\TeamFight\\GraphQL\\Mutations\\Validate@validateCrossSquads")
    "Validates the TeamRound's lineup across its Squads (§38 stk. 4): the Scenario's, or the official lineup without one. The server reads the lineup and the Members' points on the TeamRound's Ranking List, which decides who may play where, also for a Squad with its own. A coach's corrections only count for the order on a Squad; a player without points on the Ranking List has nothing to compare. A TeamRound without a Ranking List compares the Squads' stored points."
    validateTeamRoundCrossSquads(teamRoundId: ID!, scenarioId: ID) : [PlayingToHigh!]! @guard @canFind(ability: "view", find: "teamRoundId", model: "TeamRound") @field(resolver: "FlyCompany\\TeamFight\\GraphQL\\Mutations\\Validate@validateTeamRoundCrossSquads")
    "Validates categories for right streng order (category-ranking)"
    validateSquads(input: [ValidateTeam!]!) : [PlayingToHigh!]! @field(resolver: "FlyCompany\\TeamFight\\GraphQL\\Mutations\\Validate@validateSquads")
    "Validates all spots is forfilled"
    validateBasicSquads(input: [ValidateTeam!]!) : [BaseValidation!]! @field(resolver: "FlyCompany\\TeamFight\\GraphQL\\Mutations\\Validate@validateBasicSquads")
    "Players who have not turned 15 by 31.12. in the calendar year the season starts (§31 stk. 1). A warning, not a hard rule."
    validateTooYoungPlayers(input: [ValidateTeam!]!, seasonStartYear: Int!) : [TooYoungPlayer!]! @field(resolver: "FlyCompany\\TeamFight\\GraphQL\\Mutations\\Validate@validateTooYoungPlayers")
    "§43 stk. 3 findings for the Squads' reserve records: a reserve with more points than the replaced player is a possible strength increase, a warning. Only records whose reserve stands on the Squad and whose replaced player doesn't count."
    validateReserves(input: [ValidateTeam!]!) : [ReserveFinding!]! @field(resolver: "FlyCompany\\TeamFight\\GraphQL\\Mutations\\Validate@validateReserves")
    "§38 stk. 7 findings for the TeamRound's Paper Squads, from the Season History before the TeamRound. A warning, not a hard rule. Which Squads are Paper Squads is read from the TeamRound, matched to the lineup by Squad id."
    validatePaperSquads(teamRoundId: ID!, input: [ValidateTeam!]!) : PaperSquadValidation! @guard @canFind(ability: "viewSeasonHistory", find: "teamRoundId", model: "TeamRound") @field(resolver: "App\\GraphQL\\Mutations\\ValidatePaperSquads")
}

enum QualificationEligibilityStatus {
    NOT_APPLICABLE
    SATISFIED
    REQUIREMENT_NOT_MET
    CANNOT_VERIFY
}

enum QualificationEligibilityIncompleteReason {
    INCOMPARABLE_HISTORY
    MISSING_ROUND
    UNKNOWN_TIER
    MISSING_TEAM
    MISSING_SEASON
}

type QualificationEligibilityPlayer {
    squadIndex: Int!
    refId: String!
    name: String!
    "Only the round-number alternatives of §27 stk. 5 are evaluated; REQUIREMENT_NOT_MET does not establish ineligibility under the full regulation."
    status: QualificationEligibilityStatus!
    incompleteReasons: [QualificationEligibilityIncompleteReason!]!
    "Incomparable earlier TeamRounds, each once; empty when known appearances satisfy the requirement."
    uncountedRounds: [PaperSquadUncountedRound!]!
}

enum FinalRoundEligibilityStatus {
    NOT_APPLICABLE
    SATISFIED
    REQUIREMENT_NOT_MET
    CANNOT_VERIFY
}

enum FinalRoundEligibilityIncompleteReason {
    INCOMPARABLE_HISTORY
    MISSING_ROUND
    UNKNOWN_TIER
    MISSING_TEAM
    MISSING_SEASON
    MISSING_GAME_DATE
}

type FinalRoundEligibilityPlayer {
    squadIndex: Int!
    refId: String!
    name: String!
    "SATISFIED only establishes the one-appearance requirement of §38 stk. 8."
    status: FinalRoundEligibilityStatus!
    "Explicit incomplete-validation markers for CANNOT_VERIFY; empty for every other status."
    incompleteReasons: [FinalRoundEligibilityIncompleteReason!]!
    "Earlier TeamRounds without a Squad linked to the target Team, each once. Empty when a qualifying appearance is proven."
    uncountedRounds: [PaperSquadUncountedRound!]!
}

type PaperSquadValidation {
    "The TeamRound has a Paper Squad but no round number, so its phase is unknown and the paper-team rule isn't checked"
    missingRound: Boolean!
    "Players on a Paper Squad who break the paper-team rule, in lineup order"
    players: [PaperSquadPlayer!]!
}

type PaperSquadPlayer {
    "0-based index of the Paper Squad in the lineup"
    squadIndex: Int!
    refId: String!
    name: String!
    "Categories the player stands in on the Paper Squad without having played them earlier this season, in the order HS, DS, HD, DD, MD"
    unplayedCategories: [String!]!
    "Earlier team matches this season on the Paper Squad's Team or a lower one"
    matchCount: Int!
    "Earlier team matches the rule needs: 1 in the group stage from round 2, 2 in the playoffs. Round 1 is exempt, so it has no findings."
    requiredMatchCount: Int!
    "The name of the Paper Squad's Team"
    teamName: String!
    "Earlier TeamRounds the player stands in that have no Squad for the Paper Squad's Team, so they can't be compared and don't count. Only when matchCount is below requiredMatchCount; linking the Team on those Squads counts them."
    uncountedRounds: [PaperSquadUncountedRound!]!
}

type PaperSquadUncountedRound {
    teamRoundId: ID!
    name: String!
    "Null when the TeamRound has no round number"
    round: Int
}

enum ReserveFindingType {
    "§43 stk. 3: the reserve has more points than the replaced player in a category the reserve plays on the Squad. A warning: whether the team is stronger than planned is the club's judgement."
    STRENGTH_INCREASE
}

type ReserveFinding {
    type: ReserveFindingType!
    "0-based index of the Squad the reserve plays on"
    squadIndex: Int!
    "HS, DS, HD, DD or MD"
    category: String!
    "Category name, e.g. \"1. HD\""
    categoryName: String!
    reserve: ReserveFindingPlayer!
    replaced: ReserveFindingPlayer!
}

type ReserveFindingPlayer {
    refId: String
    name: String!
    "Points in the finding's category; 0 when the player has none there"
    points: Int!
}

type TooYoungPlayer {
    id: ID
    refId: String!
    name: String!
}

type BaseValidation {
    index: Int!
    spotsFulfilled: Boolean!
}

input ValidateTeam{
    name: String!
    squad: ValidateSquad
}

input ValidateSquad{
    id: ID
    playerLimit: Int!
    "A Paper Squad (§38 stk. 7): its own lineup skips the rank order on the team and the strength order against higher Squads. Like the rest of the lineup it comes from the editor; these checks are advisory and need no TeamRound."
    isPaperSquad: Boolean
    categories: [ValidateCategory]
    "Reserve records on this Squad. Only validateReserves reads them; the other checks validate the lineup as placed, which is the lineup as played."
    reserves: [ValidateReserve!]
}

input ValidateReserve {
    "The reserve, placed on this Squad"
    reserveRefId: String!
    "The replaced player with their points; they no longer stand on this Squad"
    replaced: ValidateMember!
}

input ValidateCategory {
    id: ID
    category: String!
    name: String!
    players: [ValidateMember!]!
}

input ValidateMember {
    id: ID
    refId: String!
    name: String!
    gender: Gender!
    points: [ValidatePoint!]!
}

input ValidatePoint {
    id: Int,
    points: Int
    position: Int
    category: String
    version: String
    vintage: String
}

type BelowPlayer {
    name: String!
    id: ID!
    refId: String
    isYouthPlayer: Boolean!
    category: String!
    balance: Int!
}

type PlayingToHigh{
    name: String!
    id: ID!
    refId: String!
    category: String
    gender: Gender!
    isYouthPlayer: Boolean!
    hasYouthPlayerPartner: Boolean!
    belowPlayer: [BelowPlayer!]
}
