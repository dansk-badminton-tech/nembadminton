name: Browser testing

on:
  workflow_dispatch:
  push:
    branches:
      - master

env:
  APP_ENV: dusk.ci

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: holdkamp_browertesting
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      selenium:
        image: selenium/standalone-chromium
        ports:
          - 4444:4444
        options: >-
          --shm-size="2g" --add-host=host.docker.internal:host-gateway
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          ini-file: php-production.ini

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - uses: php-actions/composer@v6
        with:
          php_version: 8.4
          version: 2
          args: --ignore-platform-reqs

      - name: Install frontend deps
        run: yarn install --frozen-lockfile

      - name: Build frontend
        run: yarn build

      - name: Generate key
        run: php artisan key:generate

      - name: Generate passport keys
        run: php artisan passport:keys

      - name: Migrate database
        run: php artisan migrate --force

      - name: Install FrankenPHP
        run: php artisan octane:install --server=frankenphp --no-interaction

      - name: Start app server
        run: php artisan octane:frankenphp --env=dusk.ci --host=0.0.0.0 --port=8000 --no-interaction > /tmp/frankenphp.log 2>&1 &

      - name: Wait for app
        run: |
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8000 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "App did not start in time"
          exit 1

      - name: Run Dusk tests
        id: dusk
        continue-on-error: true
        run: php artisan dusk --log-junit=/tmp/dusk-results.xml -vvv

      - name: Retry failed Dusk tests
        if: steps.dusk.outcome == 'failure'
        run: |
          test -s /tmp/dusk-results.xml
          filter=$(php -r '
            $results = simplexml_load_file("/tmp/dusk-results.xml");
            if ($results === false) {
                exit(1);
            }

            $cases = $results->xpath("//testcase");
            if (count($cases) === 0 || count($cases) !== (int) $results->testsuite[0]["tests"]) {
                exit(1);
            }

            $tests = [];
            foreach ($results->xpath("//testcase[failure or error]") as $test) {
                $tests[] = preg_quote((string) $test["class"], "/") . "::" . preg_quote((string) $test["name"], "/");
            }
            if ($tests) {
                echo "/^(?:" . implode("|", array_unique($tests)) . ")(?: with data set.*)?$/";
            } else {
                echo "all-passed";
            }
          ')
          if [ "$filter" = all-passed ]; then
            echo 'Dusk exited nonzero, but every test in the JUnit report passed.'
            exit 0
          fi
          php artisan dusk --filter="$filter" -vvv

      - name: Upload Dusk screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dusk-screenshots
          path: tests/Browser/screenshots
          if-no-files-found: ignore

      - name: Echo FrankenPHP logs
        if: always()
        run: cat /tmp/frankenphp.log

      - name: Upload FrankenPHP logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frankenphp-logs
          path: /tmp/frankenphp.log
          if-no-files-found: ignore

      - name: Echo laravel logs
        if: always()
        run: cat storage/logs/laravel.log

      - name: Upload Laravel Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laravel-logs
          path: storage/logs/laravel.log
          if-no-files-found: ignore

      - name: Upload Console Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: console
          path: tests/Browser/console
