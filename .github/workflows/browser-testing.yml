name: Browser testing

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    types: [opened, ready_for_review, synchronize, reopened]
    branches:
      - master

env:
  APP_ENV: dusk.ci

jobs:
  browser-tests:
    # On PRs, run only when the PR is ready for review: when it is opened as ready or
    # marked ready, and on every later push. Draft PRs are skipped.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    # The suite runs in parallel shards; bin/dusk-shard picks each shard's test classes.
    # Keep fail-fast off so one failing shard does not cancel the others.
    name: Browser tests (${{ matrix.shard }}/${{ strategy.job-total }})
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    concurrency:
      group: browser-testing-${{ github.event.pull_request.number || github.ref }}-${{ matrix.shard }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: holdkamp_browertesting
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      selenium:
        image: selenium/standalone-chromium
        ports:
          - 4444:4444
        options: >-
          --shm-size="2g" --add-host=host.docker.internal:host-gateway
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          ini-file: php-production.ini

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - uses: php-actions/composer@v6
        with:
          php_version: 8.4
          version: 2
          args: --ignore-platform-reqs

      - name: Install frontend deps
        run: yarn install --frozen-lockfile

      - name: Build frontend
        run: yarn build

      - name: Generate key
        run: php artisan key:generate

      - name: Generate passport keys
        run: php artisan passport:keys

      - name: Migrate database
        run: php artisan migrate --force

      - name: Link public storage
        run: php artisan storage:link

      # octane:install fetches the release from the GitHub API without a token and hits the shared per-IP rate limit
      # (403). Download the binary with the job token instead (the same asset Octane picks); octane:install then
      # finds it and skips the download.
      - name: Download FrankenPHP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo php/frankenphp --pattern frankenphp-linux-x86_64-gnu --output frankenphp
          chmod +x frankenphp

      - name: Install FrankenPHP
        run: php artisan octane:install --server=frankenphp --no-interaction

      - name: Start app server
        run: php artisan octane:frankenphp --env=dusk.ci --host=0.0.0.0 --port=8000 --no-interaction > /tmp/frankenphp.log 2>&1 &

      - name: Wait for app
        run: |
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8000 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "App did not start in time"
          exit 1

      - name: Run Dusk tests
        id: dusk
        continue-on-error: true
        run: php artisan dusk --filter "$(bin/dusk-shard ${{ matrix.shard }} ${{ strategy.job-total }})" --log-junit=/tmp/dusk-results.xml -vvv

      - name: Retry failed Dusk tests
        if: steps.dusk.outcome == 'failure'
        run: php artisan dusk:retry-failed /tmp/dusk-results.xml

      - name: Upload Dusk screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dusk-screenshots-${{ matrix.shard }}
          path: tests/Browser/screenshots
          if-no-files-found: ignore

      - name: Echo FrankenPHP logs
        if: always()
        run: cat /tmp/frankenphp.log

      - name: Upload FrankenPHP logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frankenphp-logs-${{ matrix.shard }}
          path: /tmp/frankenphp.log
          if-no-files-found: ignore

      - name: Echo laravel logs
        if: always()
        run: cat storage/logs/laravel.log

      - name: Upload Laravel Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laravel-logs-${{ matrix.shard }}
          path: storage/logs/laravel.log
          if-no-files-found: ignore

      - name: Upload Console Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: console-${{ matrix.shard }}
          path: tests/Browser/console
