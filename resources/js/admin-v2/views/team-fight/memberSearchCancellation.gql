query membersSearch(
    $clubhouse: Int!
    $page: Int
    $first: Int
    $playable: Boolean
    $notOnSquad: String
    $whereCancellations: QueryMembersSearchWhereCancellationsWhereConditions
    $cancellationWhere: MemberCancellationsWhereWhereConditions
){
    membersSearch(
        clubhouse: $clubhouse
        whereCancellations: $whereCancellations
        notOnSquad: $notOnSquad
        playable: $playable
        page: $page
        first: $first
    ){
        data {
            id
            name
            gender
            refId
            ownerId
            cancellations(where: $cancellationWhere){
                id
                refId
                teamRoundId
                message
                createdAt
                cancellationCollector{
                    id
                }
                dates {
                    date
                    createdAt
                }
            }
            playable
            inactive
        }
        paginatorInfo {
            count
            total
        }
    }
}
