mutation validatePlayoffParticipation($teamRoundId: ID!, $scenarioId: ID) {
    validatePlayoffParticipation(teamRoundId: $teamRoundId, scenarioId: $scenarioId) {
        squadIndex
        refId
        name
        status
        incompleteReasons
        matchCount
        requiredMatchCount
        playedByDeadline
        uncountedRounds {
            teamRoundId
            name
            round
        }
    }
}
