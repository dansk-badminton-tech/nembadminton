mutation validatePlayoffParticipation($teamRoundId: ID!, $scenarioId: ID) {
    validatePlayoffParticipation(teamRoundId: $teamRoundId, scenarioId: $scenarioId) {
        notApplicableReason
        players {
            squadIndex
            refId
            name
            status
            incompleteReasons
            matchCount
            requiredMatchCount
            playedByDeadline
            uncountedRounds {
                teamRoundId
                name
                round
            }
        }
    }
}
