mutation validatePaperSquads($teamRoundId: ID!, $input: [ValidateTeam!]!){
    validatePaperSquads(teamRoundId: $teamRoundId, input: $input){
        missingRound
        players{
            squadIndex
            refId
            name
            unplayedCategories
            matchCount
            requiredMatchCount
            teamName
            uncountedRounds{
                teamRoundId
                name
                round
            }
        }
        withoutRound{
            id
            name
        }
    }
}
