mutation validateFinalRoundEligibility($teamRoundId: ID!, $scenarioId: ID) {
    validateFinalRoundEligibility(teamRoundId: $teamRoundId, scenarioId: $scenarioId) {
        notApplicableReason
        players {
            squadIndex
            refId
            name
            status
            incompleteReasons
            uncountedRounds {
                teamRoundId
                name
                round
            }
        }
    }
}
