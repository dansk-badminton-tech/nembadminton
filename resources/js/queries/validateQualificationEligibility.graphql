mutation validateQualificationEligibility($teamRoundId: ID!, $scenarioId: ID) {
    validateQualificationEligibility(teamRoundId: $teamRoundId, scenarioId: $scenarioId) {
        notApplicableReason
        players {
            squadIndex
            refId
            name
            status
            incompleteReasons
            uncountedRounds { teamRoundId name round }
        }
    }
}
