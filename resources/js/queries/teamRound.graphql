query teamRound($id: ID!, $scenarioId: ID){
    teamRound(id: $id){
        id
        squads{
            id
            playerLimit
            order
            name
            tier
            effectiveTier
            team{
                id
                name
                tier {
                    id
                    tierName
                }
                customTierName
                groupName
            }
            playingCity
            playingZipCode
            playingAddress
            playingPlace
            playingDatetime
            externalTeamFightID
            version
            categories(scenarioId: $scenarioId){
                id
                category
                name
                players{
                    id
                    gender
                    name
                    refId
                    vintage
                    cancellation{
                        permanent
                        viaCancellationLink
                    }
                    parallelAllocation{
                        teamRoundId
                        teamRoundName
                        squadName
                        squadOrder
                        categoryName
                    }
                    reserveQuarantine{
                        teamRoundId
                        teamRoundName
                        round
                        squadPosition
                        replacedName
                    }
                    points{
                        id
                        category
                        points
                        position
                        vintage
                        corrected_manually
                        version
                    }
                }
            }
            reserves(scenarioId: $scenarioId){
                id
                reserve{
                    refId
                    name
                    gender
                    vintage
                }
                replaced{
                    refId
                    name
                    gender
                    vintage
                }
                reservePoints{
                    category
                    points
                    position
                    vintage
                }
            }
        }
        name
        gameDate
        version
        round
        reachablePlayerRefIds
        scenarios {
            id
            name
            isOfficial
        }
        season {
            id
        }
        seasonStartYear
    }
}
